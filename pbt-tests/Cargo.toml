[package]
name = "pbt-tests"
version = "0.1.0"
edition = "2021"

[dependencies]
tauri-utils = { path = "../crates/tauri-utils", features = ["resources"] }
tauri = { path = "../crates/tauri", default-features = false }
proptest = "1.6.0"
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros"] }
